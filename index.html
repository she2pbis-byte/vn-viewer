<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мероприятия — Мониторинг</title>
    
    <!-- Фавикон -->
    <link rel="icon" href="catering-b.ico" type="image/x-icon">
    
    <!-- Окрашивание статус-бара -->
    <meta name="theme-color" content="#14161a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        body { 
            background-color: #14161a; 
            margin: 0; 
            color: white; 
            -webkit-tap-highlight-color: transparent;
        }
        #root { min-height: 100vh; }
        
        /* Плавные переходы для интерактивных элементов */
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(false);
            const [dragActive, setDragActive] = useState(false);
            const [error, setError] = useState(null);

            const Icons = useMemo(() => window.lucideReact || {}, []);

            const DATA_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/events_data.json";

            const renderIcon = (IconComponent, size = 20, className = "") => {
                if (!IconComponent) return <div style={{width: size, height: size}} />;
                return <IconComponent size={size} className={className} />;
            };

            const getRoleIcon = (roleName, iconSize = 20) => {
                const roleStr = String(roleName || '').toLowerCase();
                if (roleStr.includes('официант') || roleStr === 'оф') return renderIcon(Icons.UtensilsCrossed, iconSize);
                if (roleStr.includes('бармен') || roleStr === 'бар') return renderIcon(Icons.GlassWater, iconSize);
                if (roleStr.includes('повар') || roleStr === 'пов') return renderIcon(Icons.ChefHat, iconSize);
                if (roleStr.includes('мой') || roleStr === 'мой') return renderIcon(Icons.Droplets, iconSize);
                return renderIcon(Icons.User, iconSize);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '—';
                try {
                    const date = new Date(dateStr);
                    if (isNaN(date.getTime())) return dateStr;
                    return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                } catch (e) { return dateStr; }
            };

            const getMissingStaff = (event) => {
                const needed = event.neededStaff || {};
                const currentStaff = event.staff || [];
                const missing = [];
                const roleMapping = { 'оф': 'Официант', 'бар': 'Бармен', 'пов': 'Повар', 'мой': 'Мойщица' };

                Object.entries(roleMapping).forEach(([key, label]) => {
                    const countNeeded = parseInt(needed[key]) || 0;
                    const countCurrent = currentStaff.filter(p => 
                        (p.rolesDisplay || '').toLowerCase().includes(label.toLowerCase()) ||
                        (p.roles || []).some(r => String(r).toLowerCase().includes(label.toLowerCase()))
                    ).length;

                    const diff = countNeeded - countCurrent;
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            missing.push({
                                id: `missing-${key}-${i}-${event.id || Math.random()}`,
                                isPlaceholder: true,
                                roleLabel: label,
                                roleKey: key
                            });
                        }
                    }
                });
                return missing;
            };

            const processAndSetEvents = (data) => {
                if (!data) return;
                const rawEvents = Array.isArray(data) ? data : [data];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const processedEvents = rawEvents
                    .filter(event => {
                        if (!event || !event.date) return false;
                        const eventDate = new Date(event.date);
                        const isFuture = eventDate >= today;
                        const needed = event.neededStaff || {};
                        const hasNeededStaff = Object.values(needed).some(count => parseInt(count) > 0);
                        return isFuture && hasNeededStaff;
                    })
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                setEvents(processedEvents);
                if (processedEvents.length === 0) setError("Актуальных мероприятий не найдено.");
            };

            const fetchEvents = async () => {
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch(DATA_URL);
                    if (!response.ok) throw new Error("Ошибка загрузки: " + response.status);
                    const data = await response.json();
                    processAndSetEvents(data);
                } catch (err) {
                    setError("Ошибка загрузки данных. Попробуйте обновить вручную.");
                    console.error(err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                const timer = setTimeout(fetchEvents, 100);
                return () => clearTimeout(timer);
            }, []);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        processAndSetEvents(json);
                        setError(null);
                    } catch (err) {
                        setError("Ошибка: Файл не является валидным JSON.");
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className="min-h-screen p-4 font-sans antialiased bg-[#14161a] text-slate-200">
                    <div className="max-w-2xl mx-auto">
                        <header className="mb-6 flex items-center justify-between border-b border-white/5 pb-4">
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white">Мероприятия</h1>
                                <span className="text-[10px] text-[#8a8d91] uppercase tracking-widest font-medium">Monitoring System</span>
                            </div>
                            <button 
                                onClick={fetchEvents} 
                                className={`p-2.5 rounded-full bg-white/5 hover:bg-white/10 text-[#c29b61] active:scale-95 transition-all ${loading ? 'animate-spin' : ''}`}
                            >
                                {renderIcon(Icons.RefreshCw, 18)}
                            </button>
                        </header>

                        {error && (
                            <div className="mb-4 p-4 bg-red-500/10 border border-red-500/20 text-red-400 rounded-xl text-xs flex items-center gap-2">
                                {renderIcon(Icons.AlertCircle, 14)} {error}
                            </div>
                        )}

                        {events.length === 0 && !loading && (
                            <div 
                                className={`relative border border-dashed rounded-2xl p-12 text-center transition-all ${dragActive ? 'border-[#c29b61] bg-[#c29b61]/5' : 'border-white/10 bg-[#1c1f24]'}`}
                                onDragOver={(e) => { e.preventDefault(); setDragActive(true); }}
                                onDragLeave={() => setDragActive(false)}
                                onDrop={(e) => {
                                    e.preventDefault(); setDragActive(false);
                                    if (e.dataTransfer.files[0]) handleFileUpload({target: {files: e.dataTransfer.files}});
                                }}
                            >
                                <input type="file" accept=".json" onChange={handleFileUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                <div className="flex justify-center mb-4 text-[#c29b61]/50">
                                    {renderIcon(Icons.FileJson, 40)}
                                </div>
                                <p className="text-sm text-[#8a8d91]">Перетащите JSON файл сюда или нажмите для выбора</p>
                            </div>
                        )}

                        <div className="space-y-5">
                            {events.map((event, idx) => {
                                const missing = getMissingStaff(event);
                                const allStaff = [...(event.staff || []), ...missing];

                                return (
                                    <div key={event.id || idx} className="bg-[#1c1f24] rounded-2xl border border-white/5 overflow-hidden shadow-2xl">
                                        <div className="p-5">
                                            <div className="flex items-center gap-2 text-[#c29b61] text-[11px] font-bold uppercase mb-2 tracking-wider">
                                                <div className="flex items-center gap-1.5 bg-[#c29b61]/10 px-2 py-0.5 rounded-md">
                                                    {renderIcon(Icons.Calendar, 12)}
                                                    <span>{formatDate(event.date)}</span>
                                                </div>
                                                {event.start && <span className="text-[#8a8d91] font-medium">/ {event.start}</span>}
                                            </div>
                                            
                                            <h2 className="text-xl font-bold mb-3 text-white leading-tight">{event.name}</h2>
                                            
                                            <div className="flex items-center gap-2 text-[#8a8d91] text-sm mb-5 bg-[#14161a]/50 p-2 rounded-lg inline-flex max-w-full">
                                                {renderIcon(Icons.MapPin, 14, "shrink-0")}
                                                <span className="truncate">{event.location}</span>
                                            </div>

                                            <div className="space-y-2.5 border-t border-white/5 pt-5">
                                                {allStaff.map((person, pIdx) => (
                                                    <div key={person.id || pIdx} className={`flex items-center justify-between p-3 rounded-xl border transition-all ${person.isPlaceholder ? 'bg-[#1c1f24] border-dashed border-[#c29b61]/30 opacity-80' : 'bg-[#14161a]/60 border-white/[0.03] hover:bg-[#14161a]'}`}>
                                                        <div className="flex items-center gap-3 overflow-hidden">
                                                            {/* Иконка роли */}
                                                            <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center border ${person.isPlaceholder ? 'bg-[#c29b61]/5 border-[#c29b61]/20 text-[#c29b61]' : 'bg-[#1c1f24] border-white/5 text-[#c29b61]'}`}>
                                                                {person.isPlaceholder ? getRoleIcon(person.roleKey, 18) : getRoleIcon(person.rolesDisplay || (person.roles?.[0]), 20)}
                                                            </div>
                                                            
                                                            <div className="overflow-hidden">
                                                                <div className="flex items-center gap-2">
                                                                    {/* Иконка контакта (Запрос №1) */}
                                                                    {!person.isPlaceholder && renderIcon(Icons.Contact, 14, "text-[#8a8d91] shrink-0")}
                                                                    
                                                                    <div className={`text-[13px] font-semibold truncate ${person.isPlaceholder ? 'text-[#c29b61]' : 'text-white'}`}>
                                                                        {person.isPlaceholder ? 'Требуется' : person.name}
                                                                    </div>
                                                                </div>
                                                                <div className="text-[10px] text-[#8a8d91] uppercase font-medium mt-0.5 tracking-tight">
                                                                    {person.isPlaceholder ? person.roleLabel : (person.rolesDisplay || person.roles?.[0])}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {!person.isPlaceholder ? (
                                                            <div className="flex items-center gap-2 px-2.5 py-1.5 bg-[#1c1f24] rounded-lg border border-white/5 shrink-0">
                                                                {renderIcon(Icons.Clock, 12, "text-[#c29b61]")}
                                                                <span className="text-xs font-mono font-bold text-[#c29b61]">{person.time || '--:--'}</span>
                                                            </div>
                                                        ) : (
                                                            <div className="p-2 text-[#c29b61]/40">
                                                                {renderIcon(Icons.UserPlus, 16)}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    {/* Нижний отступ для мобильных */}
                    <div className="h-10"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кейтеринг ВН</title>
    <link rel="icon" href="catering-b.ico" type="image/x-icon">
    <meta name="theme-color" content="#1F1713">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { dark: '#1F1713', card: '#604539', accent: '#FFEED2', light: '#FFFFFF' }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>
    <style>
        body { background-color: #1F1713; margin: 0; color: #FFFFFF; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .rotate-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .content-transition { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s ease-in; }
        .content-transition.expanded { max-height: 3000px; opacity: 1; }
        .urgent-vacancy-border { animation: pulse-red 1.5s infinite ease-in-out; border: 3px solid #ef4444 !important; }
        @keyframes pulse-red { 0%, 100% { border-color: rgba(239, 68, 68, 0.4); } 50% { border-color: rgba(239, 68, 68, 1); } }
        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: #2D221C; border: 2px solid #FFEED2; border-top: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; max-height: 250px; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // Конфигурация для уведомлений (Замените на свои данные)
        const TG_TOKEN = "8731971251:AAHarFjvqnMYzGwIPqLAvsF36qygPGd5OrQ"; // Токен от @BotFather
        const TG_CHAT_ID = "7016844853"; // Ваш ID или ID группы

        const App = () => {
            const [events, setEvents] = useState([]);
            const [staffDb, setStaffDb] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isInitialLoad, setIsInitialLoad] = useState(true);
            const [error, setError] = useState(null);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [filter, setFilter] = useState('ALL');
            const [staffSearch, setStaffSearch] = useState('');
            const [showAutocomplete, setShowAutocomplete] = useState(false);
            
            // Состояние формы "Могу"
            const [bookingName, setBookingName] = useState('');
            const [bookingPhone, setBookingPhone] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);

            const Icons = useMemo(() => window.LucideReact || {}, []);
            const DATA_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/events_data.json";
            const STAFF_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/staff_database.json";

            const renderIcon = (name, size = 18, className = "") => {
                const Icon = Icons[name];
                return Icon ? <Icon size={size} className={className} /> : null;
            };

            // Загрузка данных
            const fetchData = async (silent = false) => {
                if (!silent) setLoading(true);
                try {
                    const [evRes, stRes] = await Promise.all([
                        fetch(`${DATA_URL}?t=${Date.now()}`),
                        fetch(`${STAFF_URL}?t=${Date.now()}`).catch(() => null)
                    ]);
                    
                    if (evRes.ok) {
                        const data = await evRes.json();
                        setEvents(Array.isArray(data) ? data : [data]);
                    }
                    if (stRes && stRes.ok) {
                        const sData = await stRes.json();
                        setStaffDb(sData);
                    }
                } catch (err) {
                    setError("Ошибка загрузки");
                } finally {
                    setLoading(false);
                    setIsInitialLoad(false);
                }
            };

            useEffect(() => {
                fetchData();
            }, []);

            // Автозаполнение телефона при вводе имени
            useEffect(() => {
                const found = staffDb.find(s => s.name?.toLowerCase() === bookingName.trim().toLowerCase());
                if (found && found.phone) {
                    setBookingPhone(found.phone);
                }
            }, [bookingName, staffDb]);

            // При глобальном поиске подставлять имя в форму
            useEffect(() => {
                if (staffSearch) setBookingName(staffSearch);
            }, [staffSearch]);

            const getMissingStaff = (event) => {
                const needed = event.neededStaff || {};
                const current = event.staff || [];
                const roles = { 'оф': 'Официант', 'бар': 'Бармен', 'пов': 'Повар', 'мой': 'Мойщица' };
                let missing = [];
                Object.entries(roles).forEach(([key, label]) => {
                    const countNeeded = parseInt(needed[key]) || 0;
                    const countCurrent = current.filter(p => (p.rolesDisplay || '').includes(label)).length;
                    for(let i=0; i < (countNeeded - countCurrent); i++) {
                        missing.push({ roleKey: key, roleLabel: label, id: `m-${key}-${i}` });
                    }
                });
                return missing;
            };

            const validatePhone = (phone) => {
                return /^(\+7|8|7)[\s\-]?\(?[489][0-9]{2}\)?[\s\-]?[0-9]{3}[\s\-]?[0-9]{2}[\s\-]?[0-9]{2}$/.test(phone);
            };

            const sendTelegram = async (eventName, eventDate, role) => {
                if (!TG_TOKEN || !TG_CHAT_ID) {
                    alert("Система уведомлений не настроена (нет токена)");
                    return;
                }
                const text = `🚀 *НОВАЯ ЗАЯВКА*\n\n📅 *Событие:* ${eventName} (${eventDate})\n👤 *Имя:* ${bookingName}\n📞 *Тел:* ${bookingPhone}\n🛠 *Роль:* ${role}`;
                
                try {
                    const res = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TG_CHAT_ID,
                            text: text,
                            parse_mode: 'Markdown'
                        })
                    });
                    return res.ok;
                } catch { return false; }
            };

            const handleApply = async (e, event, role) => {
                e.stopPropagation();
                if (!bookingName.trim()) return alert("Введите фамилию");
                if (!validatePhone(bookingPhone)) return alert("Введите корректный номер телефона");

                setIsSubmitting(true);
                const success = await sendTelegram(event.name, event.date, role);
                setIsSubmitting(false);

                if (success) {
                    alert("Заявка отправлена! Админ свяжется с вами.");
                } else {
                    alert("Ошибка отправки. Попробуйте позже.");
                }
            };

            const filteredEvents = useMemo(() => {
                return events.filter(e => {
                    const matchesFilter = filter === 'ALL' || (filter === 'VACANCY' && getMissingStaff(e).length > 0);
                    const matchesSearch = !staffSearch || e.staff?.some(p => p.name?.toLowerCase().includes(staffSearch.toLowerCase()));
                    return matchesFilter && matchesSearch;
                }).sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [events, filter, staffSearch]);

            const autocompleteNames = useMemo(() => {
                if (staffSearch.length < 2) return [];
                return staffDb.filter(s => s.name.toLowerCase().includes(staffSearch.toLowerCase())).slice(0, 5);
            }, [staffSearch, staffDb]);

            return (
                <div className="max-w-xl mx-auto p-4">
                    <header className="flex justify-between items-center mb-6 border-b border-white/10 pb-4">
                        <div>
                            <h1 className="text-2xl font-bold text-brand-accent">Кейтеринг ВН</h1>
                            <p className="text-xs text-white/50 uppercase tracking-widest font-bold">Система бронирования</p>
                        </div>
                        <div className="w-12 h-12 bg-brand-card rounded-full border-2 border-brand-accent flex items-center justify-center">
                            <img src="catering-b.ico" className="w-8 h-8 opacity-80" alt="logo" />
                        </div>
                    </header>

                    {/* Поиск */}
                    <div className="relative mb-6">
                        <div className="absolute left-3 top-3.5 text-white/30">{renderIcon('Search', 18)}</div>
                        <input 
                            className="w-full bg-white/5 border-2 border-brand-accent/30 rounded-xl py-3 pl-10 pr-4 text-sm focus:border-brand-accent outline-none transition-all"
                            placeholder="Найти свою фамилию..."
                            value={staffSearch}
                            onChange={(e) => {setStaffSearch(e.target.value); setShowAutocomplete(true);}}
                        />
                        {showAutocomplete && autocompleteNames.length > 0 && (
                            <div className="autocomplete-dropdown">
                                {autocompleteNames.map(s => (
                                    <div key={s.name} className="p-3 hover:bg-brand-accent hover:text-brand-dark cursor-pointer border-b border-white/5"
                                         onClick={() => {setStaffSearch(s.name); setShowAutocomplete(false);}}>
                                        {s.name}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Фильтры */}
                    <div className="flex gap-2 mb-6">
                        <button onClick={() => setFilter('ALL')} className={`flex-1 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest border-2 transition-all ${filter === 'ALL' ? 'bg-brand-accent text-brand-dark border-brand-accent' : 'border-white/10 text-white/40'}`}>Все</button>
                        <button onClick={() => setFilter('VACANCY')} className={`flex-1 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest border-2 transition-all ${filter === 'VACANCY' ? 'bg-red-500 text-white border-red-500' : 'border-white/10 text-white/40'}`}>Нужны люди</button>
                    </div>

                    {/* Список */}
                    <div className="space-y-4">
                        {filteredEvents.map((event, idx) => {
                            const missing = getMissingStaff(event);
                            const isExpanded = expandedEventId === event.id;
                            
                            return (
                                <div key={event.id || idx} 
                                     onClick={() => setExpandedEventId(isExpanded ? null : event.id)}
                                     className={`bg-brand-card rounded-2xl border transition-all ${missing.length > 0 ? 'urgent-vacancy-border' : 'border-white/10'}`}>
                                    <div className="p-4">
                                        <div className="flex justify-between items-start">
                                            <div className="text-brand-accent font-bold text-lg">{event.date} <span className="text-white/40 font-normal ml-2">|</span> <span className="text-white">{event.start}</span></div>
                                            {missing.length > 0 && <span className="bg-red-500 text-[10px] px-2 py-0.5 rounded-full font-bold">НУЖНЫ ЛЮДИ</span>}
                                        </div>
                                        <h3 className="text-lg font-bold mt-1">{event.name}</h3>
                                        <p className="text-xs text-white/50 flex items-center gap-1 mt-1">{renderIcon('MapPin', 12)} {event.location}</p>
                                    </div>

                                    <div className={`content-transition ${isExpanded ? 'expanded' : ''}`}>
                                        <div className="px-4 pb-4 border-t border-white/5 pt-4">
                                            <div className="space-y-2 mb-6">
                                                {event.staff?.map((p, i) => (
                                                    <div key={i} className="flex items-center justify-between bg-black/20 p-2 rounded-xl border border-white/5">
                                                        <div className="flex items-center gap-3">
                                                            <div className="w-8 h-8 rounded-full bg-brand-accent flex items-center justify-center text-brand-dark font-bold text-xs">{p.name?.[0]}</div>
                                                            <div>
                                                                <div className="text-xs font-bold">{p.name}</div>
                                                                <div className="text-[10px] text-white/40 uppercase">{p.rolesDisplay}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-[10px] font-mono bg-white/10 px-2 py-1 rounded">{p.time}</div>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* Форма бронирования если есть вакансии */}
                                            {missing.length > 0 && (
                                                <div className="bg-black/30 p-4 rounded-2xl border border-brand-accent/20">
                                                    <h4 className="text-xs font-bold text-brand-accent uppercase tracking-tighter mb-3">Записаться на смену</h4>
                                                    <div className="space-y-3">
                                                        <input 
                                                            className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm outline-none focus:border-brand-accent"
                                                            placeholder="Твоя Фамилия"
                                                            value={bookingName}
                                                            onClick={e => e.stopPropagation()}
                                                            onChange={e => setBookingName(e.target.value)}
                                                        />
                                                        <input 
                                                            className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-sm outline-none focus:border-brand-accent"
                                                            placeholder="Номер телефона (+7...)"
                                                            type="tel"
                                                            value={bookingPhone}
                                                            onClick={e => e.stopPropagation()}
                                                            onChange={e => setBookingPhone(e.target.value)}
                                                        />
                                                        <div className="grid grid-cols-2 gap-2 pt-2">
                                                            {Array.from(new Set(missing.map(m => m.roleLabel))).map(roleLabel => (
                                                                <button 
                                                                    key={roleLabel}
                                                                    disabled={isSubmitting}
                                                                    onClick={(e) => handleApply(e, event, roleLabel)}
                                                                    className="bg-brand-accent text-brand-dark py-3 rounded-xl font-bold text-[11px] uppercase tracking-wider active:scale-95 transition-all shadow-lg"
                                                                >
                                                                    {isSubmitting ? '...' : `МОГУ (${roleLabel})`}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

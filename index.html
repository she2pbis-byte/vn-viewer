<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кейтеринг ВН | Вакансии</title>
    
    <link rel="icon" href="catering-b.ico" type="image/x-icon">
    <meta name="theme-color" content="#1F1713">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1F1713',    
                            card: '#604539',    
                            accent: '#FFEED2',
                            light: '#FFFFFF',
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        body { 
            background-color: #1F1713; 
            margin: 0; 
            color: #FFFFFF; 
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .rotate-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .content-transition {
            max-height: 0; opacity: 0; overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease-in;
        }
        .content-transition.expanded { max-height: 2500px; opacity: 1; }

        @keyframes pulse-red {
            0%, 100% { border-color: rgba(255, 0, 0, 0.4); box-shadow: 0 0 5px rgba(255,0,0,0.2); }
            50% { border-color: rgba(255, 0, 0, 1); box-shadow: 0 0 15px rgba(255,0,0,0.5); }
        }
        .urgent-vacancy-border { animation: pulse-red 1.5s infinite ease-in-out; border: 3px solid red !important; }

        .modal-overlay {
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const App = () => {
            const [events, setEvents] = useState([]);
            const [staffDb, setStaffDb] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);
            const [lastUpdated, setLastUpdated] = useState(null);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [filter, setFilter] = useState('ALL');
            const [staffSearch, setStaffSearch] = useState('');
            
            // Состояние регистрации
            const [regModal, setRegModal] = useState(null); // { event, roleLabel }
            const [regData, setRegData] = useState({ name: '', phone: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);

            const Icons = useMemo(() => window.LucideReact || {}, []);

            const DATA_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/events_data.json";
            const STAFF_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/staff_database.json";
            
            // Настройки Telegram (Пример)
            const TG_BOT_TOKEN = ""; // Вставьте токен вашего бота
            const TG_CHAT_ID = "";   // Вставьте ID чата админа

            const renderIcon = (iconName, size = 18, className = "text-white") => {
                const IconComponent = Icons[iconName];
                return IconComponent ? <IconComponent size={size} className={className} /> : null;
            };

            const fetchAllData = async (silent = false) => {
                if (!silent) setLoading(true);
                try {
                    const [evRes, stRes] = await Promise.all([
                        fetch(`${DATA_URL}?t=${Date.now()}`),
                        fetch(`${STAFF_URL}?t=${Date.now()}`).catch(() => null)
                    ]);
                    
                    if (evRes.ok) {
                        const data = await evRes.json();
                        processEvents(data);
                    }
                    if (stRes && stRes.ok) {
                        const sData = await stRes.json();
                        setStaffDb(Array.isArray(sData) ? sData : []);
                    }
                } catch (err) {
                    setError("Ошибка обновления данных");
                } finally {
                    setLoading(false);
                }
            };

            const processEvents = (data) => {
                const raw = Array.isArray(data) ? data : [data];
                const today = new Date().setHours(0,0,0,0);
                const processed = raw
                    .filter(e => e && e.date && new Date(e.date) >= today)
                    .map(e => ({
                        ...e,
                        _hasVacancies: getMissingStaff(e).length > 0
                    }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                setEvents(processed);
                setLastUpdated(new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}));
            };

            const getMissingStaff = (event) => {
                const needed = event.neededStaff || {};
                const current = event.staff || [];
                const missing = [];
                const mapping = { 'оф': 'Официант', 'бар': 'Бармен', 'пов': 'Повар', 'мой': 'Мойщица' };

                Object.entries(mapping).forEach(([key, label]) => {
                    const n = parseInt(needed[key]) || 0;
                    const c = current.filter(p => (p.rolesDisplay || '').toLowerCase().includes(label.toLowerCase())).length;
                    for (let i = 0; i < (n - c); i++) {
                        missing.push({ id: `m-${key}-${i}-${event.id}`, isPlaceholder: true, roleLabel: label, roleKey: key });
                    }
                });
                return missing;
            };

            useEffect(() => {
                fetchAllData();
                const timer = setInterval(() => fetchAllData(true), 300000);
                return () => clearInterval(timer);
            }, []);

            // Логика автозаполнения при открытии модалки
            const handleOpenReg = (event, roleLabel) => {
                let initialName = staffSearch.trim();
                let initialPhone = '';

                // Если имя есть в базе, ищем телефон
                if (initialName) {
                    const person = staffDb.find(s => s.name?.toLowerCase() === initialName.toLowerCase());
                    if (person) initialPhone = person.phone || '';
                }

                setRegData({ name: initialName, phone: initialPhone });
                setRegModal({ event, roleLabel });
            };

            // Проверка телефона при вводе имени
            const handleNameChange = (val) => {
                setRegData(prev => ({ ...prev, name: val }));
                const person = staffDb.find(s => s.name?.toLowerCase() === val.toLowerCase().trim());
                if (person && person.phone) {
                    setRegData(prev => ({ ...prev, phone: person.phone }));
                }
            };

            const validatePhone = (phone) => {
                const clean = phone.replace(/\D/g, '');
                return (clean.length === 11 && (clean.startsWith('7') || clean.startsWith('8')));
            };

            const handleSendApplication = async () => {
                if (!regData.name.trim()) return;
                if (!validatePhone(regData.phone)) {
                    alert("Введите корректный номер телефона (11 цифр)");
                    return;
                }

                setIsSubmitting(true);
                const message = `🚀 *НОВАЯ ЗАЯВКА*\n\n` +
                                `👤 *Кто:* ${regData.name}\n` +
                                `📞 *Тел:* ${regData.phone}\n` +
                                `🎯 *Роль:* ${regModal.roleLabel}\n` +
                                `📅 *Дата:* ${regModal.event.date}\n` +
                                `📍 *Событие:* ${regModal.event.name}`;

                try {
                    // Если токен и ID пустые, просто выводим успех для теста
                    if (!TG_BOT_TOKEN) {
                        console.log("Данные для отправки:", message);
                        alert("Заявка принята! (Режим отладки: Bot Token не настроен)");
                    } else {
                        await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                chat_id: TG_CHAT_ID,
                                text: message,
                                parse_mode: 'Markdown'
                            })
                        });
                        alert("Заявка успешно отправлена админу!");
                    }
                    setRegModal(null);
                } catch (e) {
                    alert("Ошибка при отправке. Попробуйте позже.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const filteredEvents = useMemo(() => {
                let res = events;
                if (filter === 'VACANCY') res = res.filter(e => e._hasVacancies);
                if (staffSearch.trim()) {
                    const s = staffSearch.toLowerCase();
                    res = res.filter(e => e.staff?.some(p => p.name?.toLowerCase().includes(s)));
                }
                return res;
            }, [events, filter, staffSearch]);

            return (
                <div className="max-w-2xl mx-auto p-4 min-h-screen">
                    {/* Header */}
                    <header className="flex justify-between items-center border-b border-white/10 pb-4 mb-6">
                        <div>
                            <h1 className="text-2xl font-bold text-white">Кейтеринг ВН</h1>
                            <p className="text-[10px] text-brand-accent/60 uppercase tracking-widest font-bold">
                                {lastUpdated ? `Обновлено: ${lastUpdated}` : 'Загрузка...'}
                            </p>
                        </div>
                        <div className={`w-12 h-12 rounded-full bg-brand-card border-2 border-brand-accent flex items-center justify-center ${loading ? 'rotate-anim' : ''}`}>
                            <img src="catering-b.ico" className="w-8 h-8" alt="logo" onError={e => e.target.src='https://cdn-icons-png.flaticon.com/512/3448/3448609.png'} />
                        </div>
                    </header>

                    {/* Filters */}
                    <div className="flex gap-2 mb-4">
                        <button onClick={() => setFilter('ALL')} className={`flex-1 py-3 rounded-xl text-[11px] font-bold uppercase tracking-wider border-2 transition-all ${filter === 'ALL' ? 'bg-brand-accent text-brand-dark border-brand-accent' : 'bg-white/5 border-white/10 text-white/40'}`}>Все</button>
                        <button onClick={() => setFilter('VACANCY')} className={`flex-1 py-3 rounded-xl text-[11px] font-bold uppercase tracking-wider border-2 transition-all ${filter === 'VACANCY' ? 'bg-red-600 text-white border-red-600' : 'bg-white/5 border-white/10 text-white/40'}`}>Вакансии</button>
                    </div>

                    {/* Search */}
                    <div className="relative mb-6">
                        <input 
                            type="text" 
                            placeholder="Поиск по фамилии..." 
                            value={staffSearch}
                            onChange={e => setStaffSearch(e.target.value)}
                            className="w-full bg-white/5 border-2 border-brand-accent/30 rounded-xl py-3 px-4 text-white focus:border-brand-accent outline-none transition-all"
                        />
                        {staffSearch && <button onClick={() => setStaffSearch('')} className="absolute right-3 top-3 text-red-500">{renderIcon('X', 20)}</button>}
                    </div>

                    {/* Events List */}
                    <div className="space-y-4">
                        {filteredEvents.map((event, idx) => (
                            <div 
                                key={event.id || idx} 
                                className={`bg-brand-card rounded-3xl border transition-all ${event._hasVacancies ? 'urgent-vacancy-border' : 'border-white/10'}`}
                            >
                                <div className="p-5" onClick={() => setExpandedEventId(expandedEventId === event.id ? null : event.id)}>
                                    <div className="flex justify-between items-start mb-1">
                                        <span className="text-brand-accent font-black text-xl">{new Date(event.date).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'})}</span>
                                        <span className="text-white/40 text-sm font-bold">{event.start}</span>
                                    </div>
                                    <h3 className="text-lg font-bold text-white leading-tight">{event.name}</h3>
                                </div>

                                <div className={`content-transition ${expandedEventId === event.id ? 'expanded' : ''}`}>
                                    <div className="px-5 pb-5 space-y-2">
                                        <div className="flex items-center gap-2 text-white/50 text-xs mb-4"><MapPin size={14}/> {event.location}</div>
                                        
                                        {[...(event.staff || []), ...getMissingStaff(event)].map((p, pIdx) => (
                                            <div 
                                                key={pIdx}
                                                onClick={(e) => { e.stopPropagation(); if(p.isPlaceholder) handleOpenReg(event, p.roleLabel); }}
                                                className={`flex items-center justify-between p-3 rounded-2xl border ${p.isPlaceholder ? 'bg-white/5 border-dashed border-white/20 active:bg-brand-accent/20' : 'bg-black/20 border-white/5'}`}
                                            >
                                                <div className="flex items-center gap-3">
                                                    <div className={`w-10 h-10 rounded-full flex items-center justify-center ${p.isPlaceholder ? 'bg-white/10' : 'bg-brand-accent text-brand-dark'}`}>
                                                        {renderIcon(p.roleLabel === 'Повар' ? 'Utensils' : p.roleLabel === 'Бармен' ? 'CupSoda' : 'User', 20, p.isPlaceholder ? 'text-white/20' : 'text-brand-dark')}
                                                    </div>
                                                    <div>
                                                        <div className={`text-sm font-bold ${p.isPlaceholder ? 'text-white/30 italic' : 'text-white'}`}>{p.isPlaceholder ? 'Вакансия открыта' : p.name}</div>
                                                        <div className="text-[10px] uppercase text-white/40 font-bold tracking-tighter">{p.isPlaceholder ? p.roleLabel : (p.rolesDisplay || p.roles?.[0])}</div>
                                                    </div>
                                                </div>
                                                {!p.isPlaceholder ? (
                                                    <div className="text-xs font-mono bg-black/40 px-2 py-1 rounded border border-white/5 text-brand-accent">{p.time}</div>
                                                ) : (
                                                    <div className="text-brand-accent animate-pulse">{renderIcon('UserPlus', 20)}</div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* Modal Registration */}
                    {regModal && (
                        <div className="modal-overlay" onClick={() => setRegModal(null)}>
                            <div className="bg-brand-card w-full max-w-sm rounded-[32px] border-2 border-brand-accent p-6 fade-in shadow-2xl" onClick={e => e.stopPropagation()}>
                                <div className="text-center mb-6">
                                    <h2 className="text-xl font-bold text-white mb-1">Записаться</h2>
                                    <p className="text-brand-accent text-sm font-medium">{regModal.roleLabel} • {regModal.event.name}</p>
                                </div>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-[10px] uppercase font-black text-white/40 ml-2">Фамилия и Имя</label>
                                        <input 
                                            type="text" 
                                            value={regData.name}
                                            onChange={e => handleNameChange(e.target.value)}
                                            placeholder="Иванов Иван"
                                            className="w-full bg-black/30 border-2 border-white/10 rounded-2xl py-3 px-4 text-white outline-none focus:border-brand-accent transition-all"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] uppercase font-black text-white/40 ml-2">Номер телефона</label>
                                        <input 
                                            type="tel" 
                                            value={regData.phone}
                                            onChange={e => setRegData({...regData, phone: e.target.value})}
                                            placeholder="89001234567"
                                            className="w-full bg-black/30 border-2 border-white/10 rounded-2xl py-3 px-4 text-white outline-none focus:border-brand-accent transition-all"
                                        />
                                        {!validatePhone(regData.phone) && regData.phone.length > 0 && (
                                            <p className="text-[10px] text-red-400 mt-1 ml-2">Введите 11 цифр (начиная с 7 или 8)</p>
                                        )}
                                    </div>
                                    
                                    <button 
                                        disabled={isSubmitting || !regData.name || !validatePhone(regData.phone)}
                                        onClick={handleSendApplication}
                                        className={`w-full py-4 rounded-2xl font-black uppercase tracking-widest transition-all shadow-lg ${isSubmitting || !regData.name || !validatePhone(regData.phone) ? 'bg-white/10 text-white/20' : 'bg-brand-accent text-brand-dark active:scale-95'}`}
                                    >
                                        {isSubmitting ? 'Отправка...' : 'МОГУ!'}
                                    </button>
                                    
                                    <button onClick={() => setRegModal(null)} className="w-full py-2 text-white/40 text-xs font-bold uppercase tracking-tighter">Отмена</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const MapPin = ({size}) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>;

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

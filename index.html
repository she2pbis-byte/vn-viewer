<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мероприятия — Мониторинг</title>
    
    <link rel="icon" href="catering-b.ico" type="image/x-icon">
    
    <meta name="theme-color" content="#1F1713">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1F1713',    
                            card: '#604539',    
                            accent: '#FFFFFF',  // Изменено на белый для акцентов
                            light: '#FFFFFF',   // Изменено на чисто белый
                        }
                    }
                }
            }
        }
    </script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        body { 
            background-color: #1F1713; 
            margin: 0; 
            color: #FFFFFF; 
            -webkit-tap-highlight-color: transparent;
        }
        #root { min-height: 100vh; }
        .transition-all { transition: all 0.2s ease-in-out; }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1F1713; }
        ::-webkit-scrollbar-thumb { background: #FFFFFF; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const App = () => {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            const Icons = useMemo(() => window.lucideReact || {}, []);
            const DATA_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/events_data.json";

            const renderIcon = (IconComponent, size = 20, className = "") => {
                if (!IconComponent) return <div style={{width: size, height: size}} />;
                return <IconComponent size={size} className={className} />;
            };

            const getRoleIcon = (roleName, iconSize = 20) => {
                const roleStr = String(roleName || '').toLowerCase();
                if (roleStr.includes('официант') || roleStr === 'оф') return renderIcon(Icons.UtensilsCrossed, iconSize);
                if (roleStr.includes('бармен') || roleStr === 'бар') return renderIcon(Icons.GlassWater, iconSize);
                if (roleStr.includes('повар') || roleStr === 'пов') return renderIcon(Icons.ChefHat, iconSize);
                if (roleStr.includes('мой') || roleStr === 'мой') return renderIcon(Icons.Droplets, iconSize);
                return renderIcon(Icons.User, iconSize);
            };

            const formatDate = (dateStr) => {
                if (!dateStr) return '—';
                try {
                    const date = new Date(dateStr);
                    return date.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
                } catch (e) { return dateStr; }
            };

            const getMissingStaff = (event) => {
                const needed = event.neededStaff || {};
                const currentStaff = event.staff || [];
                const missing = [];
                const roleMapping = { 'оф': 'Официант', 'бар': 'Бармен', 'пов': 'Повар', 'мой': 'Мойщица' };

                Object.entries(roleMapping).forEach(([key, label]) => {
                    const countNeeded = parseInt(needed[key]) || 0;
                    const countCurrent = currentStaff.filter(p => 
                        (p.rolesDisplay || '').toLowerCase().includes(label.toLowerCase()) ||
                        (p.roles || []).some(r => String(r).toLowerCase().includes(label.toLowerCase()))
                    ).length;

                    const diff = countNeeded - countCurrent;
                    if (diff > 0) {
                        for (let i = 0; i < diff; i++) {
                            missing.push({
                                id: `missing-${key}-${i}-${event.id || Math.random()}`,
                                isPlaceholder: true,
                                roleLabel: label,
                                roleKey: key
                            });
                        }
                    }
                });
                return missing;
            };

            const processAndSetEvents = (data) => {
                if (!data) return;
                const rawEvents = Array.isArray(data) ? data : [data];
                const today = new Date();
                today.setHours(0, 0, 0, 0);

                const processedEvents = rawEvents
                    .filter(event => {
                        if (!event || !event.date) return false;
                        const eventDate = new Date(event.date);
                        return eventDate >= today;
                    })
                    .sort((a, b) => new Date(a.date) - new Date(b.date));

                setEvents(processedEvents);
                if (processedEvents.length === 0) setError("Актуальных мероприятий не найдено.");
            };

            const fetchEvents = async () => {
                setLoading(true);
                setError(null);
                try {
                    const response = await fetch(DATA_URL);
                    if (!response.ok) throw new Error("Ошибка загрузки");
                    const data = await response.json();
                    processAndSetEvents(data);
                } catch (err) {
                    setError("Ошибка загрузки данных.");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { fetchEvents(); }, []);

            return (
                <div className="min-h-screen p-4 font-sans antialiased bg-brand-dark text-white">
                    <div className="max-w-2xl mx-auto">
                        <header className="mb-6 flex items-center justify-between border-b border-white/20 pb-4">
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-white">Мероприятия</h1>
                                <span className="text-[10px] text-white/60 uppercase tracking-widest font-bold">Monitoring System</span>
                            </div>
                            <button 
                                onClick={fetchEvents} 
                                className={`p-2.5 rounded-full bg-brand-card hover:bg-white/10 text-white active:scale-95 transition-all ${loading ? 'animate-spin' : ''}`}
                            >
                                {renderIcon(Icons.RefreshCw, 18)}
                            </button>
                        </header>

                        {error && (
                            <div className="mb-4 p-4 bg-red-900/30 border border-red-500/30 text-white rounded-xl text-xs flex items-center gap-2">
                                {renderIcon(Icons.AlertCircle, 14)} {error}
                            </div>
                        )}

                        <div className="space-y-5">
                            {events.map((event, idx) => {
                                const missing = getMissingStaff(event);
                                const allStaff = [...(event.staff || []), ...missing];

                                return (
                                    <div key={event.id || idx} className="bg-brand-card rounded-2xl border border-white/10 overflow-hidden shadow-xl">
                                        <div className="p-5">
                                            <div className="flex items-center gap-2 text-white text-[11px] font-bold uppercase mb-2 tracking-wider">
                                                <div className="flex items-center gap-1.5 bg-white/10 px-2 py-0.5 rounded-md text-white">
                                                    {renderIcon(Icons.Calendar, 12)}
                                                    <span>{formatDate(event.date)}</span>
                                                </div>
                                                {event.start && <span className="text-white/60 font-medium">/ {event.start}</span>}
                                            </div>
                                            
                                            <h2 className="text-xl font-bold mb-3 text-white leading-tight">{event.name}</h2>
                                            
                                            <div className="flex items-center gap-2 text-white/80 text-sm mb-5 bg-black/20 p-2 rounded-lg inline-flex max-w-full">
                                                {renderIcon(Icons.MapPin, 14, "shrink-0 text-white")}
                                                <span className="truncate">{event.location}</span>
                                            </div>

                                            <div className="space-y-2.5 border-t border-white/10 pt-5">
                                                {allStaff.map((person, pIdx) => (
                                                    <div key={person.id || pIdx} className={`flex items-center justify-between p-3 rounded-xl border transition-all ${person.isPlaceholder ? 'bg-brand-card border-dashed border-white/30' : 'bg-black/20 border-white/5 hover:bg-black/40'}`}>
                                                        <div className="flex items-center gap-3 overflow-hidden">
                                                            <div className={`w-10 h-10 shrink-0 rounded-full flex items-center justify-center border ${person.isPlaceholder ? 'bg-white/5 border-white/20 text-white/40' : 'bg-brand-card border-white/30 text-white'}`}>
                                                                {person.isPlaceholder 
                                                                    ? getRoleIcon(person.roleKey, 18) 
                                                                    : renderIcon(Icons.Contact, 20)
                                                                }
                                                            </div>
                                                            
                                                            <div className="overflow-hidden">
                                                                <div className={`text-[13px] font-semibold truncate text-white`}>
                                                                    {person.isPlaceholder ? 'Требуется' : person.name}
                                                                </div>
                                                                <div className="text-[10px] text-white/50 uppercase font-bold mt-0.5 tracking-tight">
                                                                    {person.isPlaceholder ? person.roleLabel : (person.rolesDisplay || person.roles?.[0])}
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {!person.isPlaceholder ? (
                                                            <div className="flex items-center gap-2 px-2.5 py-1.5 bg-black/20 rounded-lg border border-white/10 shrink-0">
                                                                {renderIcon(Icons.Clock, 12, "text-white/70")}
                                                                <span className="text-xs font-mono font-bold text-white">{person.time || '--:--'}</span>
                                                            </div>
                                                        ) : (
                                                            <div className="p-2 text-white/30">
                                                                {renderIcon(Icons.UserPlus, 16)}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                    <div className="h-10"></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

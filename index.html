<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кейтеринг ВН</title>
    <link rel="icon" href="catering-b.ico" type="image/x-icon">
    <meta name="theme-color" content="#1F1713">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#1F1713',    
                            card: '#604539',    
                            accent: '#FFEED2',
                            light: '#FFFFFF',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        body { background-color: #1F1713; margin: 0; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
        .transition-all { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .rotate-anim { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .content-transition { max-height: 0; opacity: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s ease-in; }
        .content-transition.expanded { max-height: 3000px; opacity: 1; }
        .urgent-vacancy-border { animation: pulse-red-border 1.5s infinite ease-in-out; border: 4px solid red !important; }
        @keyframes pulse-red-border { 
            0%, 100% { border-color: rgba(255, 0, 0, 0.4); box-shadow: 0 0 5px rgba(255, 0, 0, 0.2); }
            50% { border-color: rgba(255, 0, 0, 1); box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); }
        }
        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: #2D221C; border: 2px solid #FFEED2; border-top: none; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; max-height: 250px; overflow-y: auto; }
        input:focus { outline: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        const App = () => {
            const [events, setEvents] = useState([]);
            const [staffDb, setStaffDb] = useState([]);
            const [loading, setLoading] = useState(false);
            const [isInitialLoad, setIsInitialLoad] = useState(true);
            const [error, setError] = useState(null);
            const [lastUpdated, setLastUpdated] = useState(null);
            const [expandedEventId, setExpandedEventId] = useState(null);
            const [filter, setFilter] = useState('ALL');
            
            // Фильтрация/Поиск
            const [staffSearch, setStaffSearch] = useState('');
            const [showAutocomplete, setShowAutocomplete] = useState(false);
            const autocompleteRef = useRef(null);

            // Форма заявки
            const [submissionName, setSubmissionName] = useState('');
            const [submissionPhone, setSubmissionPhone] = useState('');
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null); // { success: bool, msg: string }

            const DATA_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/events_data.json";
            const STAFF_DB_URL = "https://raw.githubusercontent.com/she2pbis-byte/vn/main/staff_database.json";
            
            // Конфигурация Telegram (Замените на свои данные)
            const TG_TOKEN = "YOUR_BOT_TOKEN"; 
            const TG_CHAT_ID = "YOUR_CHAT_ID";

            const Icons = useMemo(() => window.LucideReact || window.lucide || {}, []);

            const renderIcon = (name, size = 18, className = "text-white") => {
                const Icon = Icons[name];
                return Icon ? <Icon size={size} className={className} /> : null;
            };

            const fetchEvents = async (silent = false) => {
                if (!silent) setLoading(true);
                try {
                    const [eventsRes, staffRes] = await Promise.all([
                        fetch(`${DATA_URL}?t=${Date.now()}`),
                        fetch(`${STAFF_DB_URL}?t=${Date.now()}`).catch(() => null)
                    ]);

                    if (!eventsRes.ok) throw new Error("Ошибка загрузки");
                    const eventsData = await eventsRes.json();
                    
                    if (staffRes && staffRes.ok) {
                        const sData = await staffRes.json();
                        setStaffDb(Array.isArray(sData) ? sData : []);
                    }

                    processAndSetEvents(eventsData);
                } catch (err) {
                    setError("Ошибка загрузки данных");
                } finally {
                    setLoading(false);
                    setIsInitialLoad(false);
                }
            };

            const processAndSetEvents = (data) => {
                const today = new Date().setHours(0,0,0,0);
                const processed = (Array.isArray(data) ? data : [data])
                    .filter(e => e && e.date && new Date(e.date) >= today)
                    .map(e => ({
                        ...e,
                        _hasUrgent: getMissingStaffCount(e) > 0
                    }))
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
                
                setEvents(processed);
                setLastUpdated(new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }));
            };

            const getMissingStaffCount = (event) => {
                const needed = event.neededStaff || {};
                const current = event.staff || [];
                let totalNeeded = 0;
                ['оф', 'бар', 'пов', 'мой'].forEach(role => {
                    const req = parseInt(needed[role]) || 0;
                    const have = current.filter(p => (p.rolesDisplay || '').toLowerCase().includes(role)).length;
                    if (req > have) totalNeeded += (req - have);
                });
                return totalNeeded;
            };

            // Автоподстановка при выборе из поиска
            useEffect(() => {
                if (staffSearch) {
                    setSubmissionName(staffSearch);
                    const found = staffDb.find(s => s.name && s.name.toLowerCase() === staffSearch.toLowerCase().trim());
                    if (found && found.phone) setSubmissionPhone(found.phone);
                }
            }, [staffSearch, staffDb]);

            const validatePhone = (phone) => {
                const clean = phone.replace(/\D/g, '');
                return (clean.length === 11 && (clean.startsWith('7') || clean.startsWith('8')));
            };

            const sendToTelegram = async (event) => {
                if (!submissionName.trim()) return alert("Введите фамилию");
                if (!validatePhone(submissionPhone)) return alert("Введите корректный номер телефона (11 цифр)");

                setIsSubmitting(true);
                const message = `🚀 *Новая заявка!*\n\n📅 *Событие:* ${event.name}\n📆 *Дата:* ${event.date}\n👤 *Сотрудник:* ${submissionName}\n📞 *Телефон:* ${submissionPhone}`;
                
                try {
                    // Здесь пример имитации или реальный fetch к вашему обработчику
                    // Если используете бота напрямую:
                    // await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, { ... })
                    
                    console.log("Отправка:", message);
                    setTimeout(() => {
                        setSubmitStatus({ success: true, msg: "Заявка отправлена!" });
                        setIsSubmitting(false);
                        setTimeout(() => setSubmitStatus(null), 3000);
                    }, 1000);
                } catch (e) {
                    setSubmitStatus({ success: false, msg: "Ошибка отправки" });
                    setIsSubmitting(false);
                }
            };

            const filteredAutocompleteNames = useMemo(() => {
                if (!staffSearch || staffSearch.length < 1) return [];
                const searchLower = staffSearch.toLowerCase();
                const namesFromEvents = new Set();
                events.forEach(e => e.staff?.forEach(p => p.name && namesFromEvents.add(p.name)));
                staffDb.forEach(s => s.name && namesFromEvents.add(s.name));
                
                return Array.from(namesFromEvents)
                    .filter(n => n.toLowerCase().includes(searchLower))
                    .slice(0, 8);
            }, [staffSearch, events, staffDb]);

            const filteredEvents = useMemo(() => {
                let res = events;
                if (filter === 'VACANCY') res = res.filter(e => e._hasUrgent);
                if (staffSearch.trim()) {
                    const s = staffSearch.toLowerCase();
                    res = res.filter(e => e.staff?.some(p => p.name?.toLowerCase().includes(s)));
                }
                return res;
            }, [events, filter, staffSearch]);

            useEffect(() => { fetchEvents(); }, []);

            return (
                <div className="min-h-screen p-4 bg-brand-dark">
                    <div className="max-w-2xl mx-auto">
                        <header className="mb-4 flex items-center justify-between border-b border-white/20 pb-4">
                            <div>
                                <h1 className="text-2xl font-bold text-white mb-1">Кейтеринг ВН</h1>
                                <span className="text-[12px] text-white/50 uppercase font-bold">Обновлено: {lastUpdated || '--:--'}</span>
                            </div>
                            <button onClick={() => fetchEvents()} className="w-12 h-12 rounded-full bg-brand-card border-2 border-brand-accent flex items-center justify-center">
                                <img src="catering-b.ico" className={`w-7 h-7 ${loading ? 'rotate-anim' : ''}`} alt="L" />
                            </button>
                        </header>

                        {/* Поиск */}
                        <div className="mb-6 relative" ref={autocompleteRef}>
                            <div className="relative">
                                <div className="absolute inset-y-0 left-4 flex items-center opacity-40">{renderIcon('Search', 16)}</div>
                                <input 
                                    type="text"
                                    value={staffSearch}
                                    onChange={(e) => {setStaffSearch(e.target.value); setShowAutocomplete(true);}}
                                    onFocus={() => setShowAutocomplete(true)}
                                    placeholder="Поиск по фамилии..."
                                    className="w-full bg-white/5 border-2 border-brand-accent rounded-xl py-3 pl-11 pr-4 text-white placeholder:text-white/30"
                                />
                            </div>
                            {showAutocomplete && filteredAutocompleteNames.length > 0 && (
                                <div className="autocomplete-dropdown shadow-2xl">
                                    {filteredAutocompleteNames.map((name, i) => (
                                        <div key={i} onClick={() => {setStaffSearch(name); setShowAutocomplete(false);}} className="px-4 py-3 border-b border-white/5 active:bg-brand-accent active:text-brand-dark cursor-pointer">
                                            {name}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        {/* Фильтры */}
                        <div className="flex gap-2 mb-6">
                            <button onClick={() => setFilter('ALL')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold uppercase border-2 transition-all ${filter === 'ALL' ? 'bg-brand-accent text-brand-dark border-brand-accent' : 'bg-white/5 text-white/40 border-white/10'}`}>Все</button>
                            <button onClick={() => setFilter('VACANCY')} className={`flex-1 py-2.5 rounded-lg text-xs font-bold uppercase border-2 transition-all ${filter === 'VACANCY' ? 'bg-red-600 text-white border-red-600' : 'bg-white/5 text-white/40 border-white/10'}`}>Вакансии</button>
                        </div>

                        {/* Список */}
                        <div className="space-y-4">
                            {filteredEvents.map((event, idx) => {
                                const isExpanded = expandedEventId === event.id || (filteredEvents.length === 1 && staffSearch);
                                return (
                                    <div key={event.id || idx} className={`bg-brand-card rounded-3xl border transition-all ${event._hasUrgent ? 'urgent-vacancy-border' : 'border-white/10'}`}>
                                        <div onClick={() => setExpandedEventId(isExpanded ? null : (event.id || idx))} className="p-5 flex justify-between items-center cursor-pointer">
                                            <div>
                                                <div className="text-brand-accent font-bold text-lg">{new Date(event.date).toLocaleDateString('ru-RU')} {event.start && `| ${event.start}`}</div>
                                                <div className="text-white font-bold text-xl">{event.name}</div>
                                            </div>
                                            {renderIcon(isExpanded ? 'ChevronUp' : 'ChevronDown', 24, "text-white/30")}
                                        </div>

                                        <div className={`content-transition ${isExpanded ? 'expanded' : ''}`}>
                                            <div className="px-5 pb-6 space-y-4">
                                                <div className="text-white/60 text-sm flex items-center gap-2"><MapPin size={14}/> {event.location}</div>
                                                
                                                {/* Форма подачи заявки */}
                                                {event._hasUrgent && (
                                                    <div className="bg-black/30 p-4 rounded-2xl border border-white/10 space-y-3">
                                                        <div className="text-[10px] uppercase font-black text-brand-accent tracking-widest">Подать заявку</div>
                                                        <div className="grid grid-cols-1 gap-2">
                                                            <input 
                                                                type="text" 
                                                                placeholder="Фамилия" 
                                                                value={submissionName}
                                                                onChange={(e) => setSubmissionName(e.target.value)}
                                                                className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-brand-accent"
                                                            />
                                                            <input 
                                                                type="tel" 
                                                                placeholder="Номер телефона (+7...)" 
                                                                value={submissionPhone}
                                                                onChange={(e) => setSubmissionPhone(e.target.value)}
                                                                className="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:border-brand-accent"
                                                            />
                                                        </div>
                                                        <button 
                                                            onClick={(e) => { e.stopPropagation(); sendToTelegram(event); }}
                                                            disabled={isSubmitting}
                                                            className="w-full bg-brand-accent text-brand-dark font-black py-3 rounded-xl active:scale-95 transition-transform flex items-center justify-center gap-2"
                                                        >
                                                            {isSubmitting ? <div className="w-5 h-5 border-2 border-brand-dark border-t-transparent rounded-full animate-spin"></div> : "МОГУ"}
                                                        </button>
                                                        {submitStatus && (
                                                            <div className={`text-center text-xs font-bold ${submitStatus.success ? 'text-green-400' : 'text-red-400'}`}>
                                                                {submitStatus.msg}
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                <div className="space-y-2">
                                                    <div className="text-[10px] uppercase font-black text-white/30 tracking-widest">Персонал</div>
                                                    {event.staff?.map((p, i) => (
                                                        <div key={i} className={`flex justify-between items-center p-3 rounded-xl bg-black/20 border border-white/5 ${staffSearch && p.name?.toLowerCase().includes(staffSearch.toLowerCase()) ? 'border-brand-accent bg-brand-accent/10' : ''}`}>
                                                            <div className="text-sm font-bold">{p.name} <span className="block text-[10px] text-white/40 uppercase">{p.rolesDisplay || p.roles?.[0]}</span></div>
                                                            <div className="text-xs font-mono bg-black/40 px-2 py-1 rounded text-brand-accent">{p.time || '--:--'}</div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const { MapPin, ChevronDown, ChevronUp, Search } = window.LucideReact;
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

name: Build Android APK

on:
  push:
    branches: [ main ] # Сборка запускается при каждом пуше в ветку main
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой в Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core

      - name: Prepare Web Assets
        run: |
          # Создаем папку www, которую требует Capacitor
          mkdir -p www
          # Копируем ваш HTML файл
          cp index.html www/
          # Копируем все изображения и иконки (если они есть в корне)
          cp *.png www/ 2>/dev/null || true
          cp *.ico www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true

      - name: Build Capacitor Project
        run: |
          # Инициализируем андроид-проект и синхронизируем ресурсы из папки www
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          # Собираем дебаг-версию APK
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn-catering-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

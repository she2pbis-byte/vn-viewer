name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install @capacitor/android @capacitor/cli @capacitor/core @capacitor/assets

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp *.png www/ 2>/dev/null || true
          cp *.ico www/ 2>/dev/null || true
          
          # Создаем структуру для генератора ресурсов
          mkdir -p assets
          # Используем ваш icon.png как основной источник
          cp icon.png assets/icon-only.png
          cp icon.png assets/icon-foreground.png
          cp icon.png assets/icon-background.png

      - name: Build Capacitor Project
        run: |
          npx cap add android
          # Генерируем иконки до синхронизации
          npx capacitor-assets generate --android
          npx cap copy android
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK (Debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vn-catering-with-icon
          path: android/app/build/outputs/apk/debug/app-debug.apk
